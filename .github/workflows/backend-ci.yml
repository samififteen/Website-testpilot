name: Backend CI

on:
  push:
    branches: [main]
    paths:
      - 'backend/**'
      - 'test-sites/**'
      - '.github/workflows/backend-ci.yml'
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: backend-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint and format
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements*.txt

      - name: Install lint dependencies
        run: pip install -r requirements-dev.txt

      - name: Ruff lint
        run: ruff check app tests --output-format=github

      - name: Ruff format check
        run: ruff format --check app tests

  test:
    name: pytest
    # Pinned: 'ubuntu-latest' now resolves to Ubuntu 26.04, which the pinned
    # Playwright build has no browser/dependency mapping for.
    runs-on: ubuntu-24.04
    # Keep a stuck browser run from occupying a runner for 6 hours.
    timeout-minutes: 20
    needs: lint
    defaults:
      run:
        working-directory: backend
    env:
      TESTPILOT_ALLOW_LOCAL_TARGETS: 'true'
      TESTPILOT_AI_ENABLED: 'false'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements*.txt

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Install Chromium for the browser tests
        run: python -m playwright install --with-deps chromium

      - name: Run tests
        run: |
          for i in 1 2 3 4; do
            echo "=== run $i ==="
            pytest --junitxml=reports/pytest.xml -q --tb=short -rf 2>&1 | tee "pytest-$i.log"
            echo "=== run $i exit ${PIPESTATUS[0]} ==="
          done

      - name: Annotate failures
        if: always()
        run: |
          grep -hE "exit [0-9]+" pytest-*.log | head -6 | while IFS= read -r line; do
            echo "::notice title=exit::$line"
          done
          grep -hE "^(FAILED|ERROR)" pytest-*.log | head -10 | while IFS= read -r line; do
            echo "::error title=failing-test::$line"
          done
          grep -hE "^E   " pytest-*.log | head -10 | while IFS= read -r line; do
            echo "::error title=assert::$line"
          done
          grep -hE "^(FAILED|ERROR)" pytest-*.log | head -1 >/dev/null || true

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-results
          path: |
            backend/reports/pytest.xml
          if-no-files-found: ignore
          retention-days: 14
