name: Backend CI

on:
  push:
    branches: [main]
    paths:
      - 'backend/**'
      - 'test-sites/**'
      - '.github/workflows/backend-ci.yml'
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: backend-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint and format
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements*.txt

      - name: Install lint dependencies
        run: pip install -r requirements-dev.txt

      - name: Ruff lint
        run: ruff check app tests --output-format=github

      - name: Ruff format check
        run: ruff format --check app tests

  test:
    name: pytest
    runs-on: ubuntu-latest
    needs: lint
    defaults:
      run:
        working-directory: backend
    env:
      TESTPILOT_ALLOW_LOCAL_TARGETS: 'true'
      TESTPILOT_AI_ENABLED: 'false'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements*.txt

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Install Chromium for the browser tests
        run: python -m playwright install --with-deps chromium

      - name: Run tests
        run: pytest --junitxml=reports/pytest.xml

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-results
          path: |
            backend/reports/pytest.xml
          if-no-files-found: ignore
          retention-days: 14
