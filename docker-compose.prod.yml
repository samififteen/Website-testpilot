# Production compose file used by .github/workflows/deploy.yml.
# Images are pulled from the registry and tagged by commit SHA:
#   BACKEND_IMAGE=ghcr.io/<owner>/<repo>-backend:<sha>
#   FRONTEND_IMAGE=ghcr.io/<owner>/<repo>-frontend:<sha>
# Copy the repository's docker-compose.prod.yml to the deploy host (DEPLOY_PATH).
services:
  backend:
    image: ${BACKEND_IMAGE:?set BACKEND_IMAGE to the SHA-tagged backend image}
    restart: unless-stopped
    environment:
      TESTPILOT_DATABASE_URL: sqlite:////data/testpilot.db
      TESTPILOT_SCREENSHOT_DIR: /data/screenshots
      TESTPILOT_REPORT_DIR: /data/reports
      TESTPILOT_ALLOWED_ORIGINS: '["https://testpilot.example.com"]'
      TESTPILOT_ALLOW_LOCAL_TARGETS: 'false'
      AI_API_KEY: ${AI_API_KEY:-}
      TESTPILOT_AI_MODEL: ${TESTPILOT_AI_MODEL:-gpt-4o-mini}
    volumes:
      - testpilot-data:/data
    expose:
      - '8000'
    healthcheck:
      test: ['CMD', 'curl', '-fsS', 'http://127.0.0.1:8000/api/health']
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 25s
    security_opt:
      - no-new-privileges:true
    shm_size: '1gb'

  frontend:
    image: ${FRONTEND_IMAGE:?set FRONTEND_IMAGE to the SHA-tagged frontend image}
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - '8080:8080'
    security_opt:
      - no-new-privileges:true

volumes:
  testpilot-data:
    name: testpilot-data
