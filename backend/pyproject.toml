[project]
name = "testpilot-ai-backend"
version = "1.0.0"
description = "TestPilot AI backend — automated website testing with Playwright"
requires-python = ">=3.12"

[tool.pytest.ini_options]
testpaths = ["tests"]
# One event loop for the whole run: Playwright handles are bound to the loop
# that created them, and switching loops per test leaves driver subprocesses to
# be garbage collected on a closed loop (an unraisable exception, which pytest
# escalates to a teardown error).
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
asyncio_default_test_loop_scope = "session"
addopts = "-q"
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["app", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
ignore = ["B008", "RUF001", "RUF002", "RUF003", "SIM108"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101", "E501"]
# Long lines are unavoidable inside the embedded browser script and HTML template.
"app/services/browser/page_inspector.py" = ["E501"]
"app/services/reporting/report_builder.py" = ["E501"]
"app/services/ai/rule_based.py" = ["E501"]
